[package]
name = "sw-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
diagnostics = []

[dependencies]
base64.workspace = true
digest_auth = "=0.3.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
getrandom.workspace = true
jpeg-encoder.workspace = true
process-wrap.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"] }
ring = "=0.17.14"
roxmltree = { version = "=0.21.1", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2 = "=0.6.5"
sw-domain.workspace = true
sw-protocol = { workspace = true, features = ["worker"] }
sw-storage.workspace = true
thiserror.workspace = true
tempfile.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["process", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = ["Win32_System_Threading"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[dev-dependencies]
rustls.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
