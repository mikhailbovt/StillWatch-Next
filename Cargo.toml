[workspace]
members = ["bins/*", "crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "=1.0.104"
async-stream = "=0.3.6"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
ed25519-dalek = "=2.2.0"
ffmpeg-next = { version = "=8.1.0", default-features = false, features = ["device", "software-scaling"] }
fs4 = "=1.1.0"
getrandom = "=0.4.3"
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["service", "tokio"] }
jpeg-encoder = { version = "=0.7.1", features = ["simd"] }
mdns-sd = { version = "=0.21.7", default-features = false }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-31", "load-dynamic", "cuda"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "process-group", "kill-on-drop", "creation-flags"] }
prost = { version = "=0.14.6", default-features = false }
qrcode = { version = "=0.14.1", default-features = false }
reqwest = { version = "=0.13.5", default-features = false }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled", "backup"] }
schemars = { version = "=1.2.3", features = ["uuid1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "=1.54.1", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
tower = { version = "=0.5.3", default-features = false }
uuid = { version = "=1.29.2", features = ["serde", "v4"] }
sw-capture = { path = "crates/sw-capture" }
sw-api = { path = "crates/sw-api" }
sw-domain = { path = "crates/sw-domain" }
sw-engine = { path = "crates/sw-engine" }
sw-inference = { path = "crates/sw-inference" }
sw-protocol = { path = "crates/sw-protocol" }
stillwatch-sdk = { path = "crates/stillwatch-sdk" }
sw-storage = { path = "crates/sw-storage" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
