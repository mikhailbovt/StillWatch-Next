[project]
name = "stillwatch-model-export"
version = "0.1.0"
requires-python = ">=3.12.14,<3.13"
dependencies = [
    "numpy==2.5.4",
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
    "opencv-python==5.0.0.93",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "safetensors==0.8.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "ultralytics==8.4.177",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
