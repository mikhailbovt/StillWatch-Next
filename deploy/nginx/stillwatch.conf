# Include in nginx's http context. Use the DNS name, certificate and
# loopback upstream from the Core settings.
limit_req_zone $binary_remote_addr zone=stillwatch_requests:10m rate=12r/s;
limit_conn_zone $binary_remote_addr zone=stillwatch_clients:10m;
limit_conn_zone $server_name zone=stillwatch_ingress:1m;

server {
    listen 443 ssl;
    server_name watch.example.com;

    ssl_certificate /etc/nginx/stillwatch/endpoint.pem;
    ssl_certificate_key /etc/nginx/stillwatch/endpoint.key;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    access_log off;
    error_log /var/log/nginx/stillwatch-error.log crit;
    client_header_timeout 5s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;
    client_max_body_size 64k;
    limit_req zone=stillwatch_requests burst=24 nodelay;
    limit_req_status 429;
    limit_conn stillwatch_clients 12;
    limit_conn stillwatch_ingress 80;
    limit_conn_status 429;
    if ($http_host != "watch.example.com") { return 421; }

    # Install the separate upstream token as a private proxy_set_header directive.
    include /etc/nginx/stillwatch/upstream-token.conf;
    proxy_set_header Host watch.example.com;
    proxy_set_header X-StillWatch-Client-Address $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 35s;
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_redirect off;

    location = /api/v2/replay-uploads { return 403; }
    location / { proxy_pass http://127.0.0.1:8766; }
}
